<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#006a4e" />
      <stop offset="100%" stop-color="#004d38" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)" />

  <!-- Bangladeshi Red Circle Motif (Subtle backdrop) -->
  <circle cx="256" cy="235" r="140" fill="#f42a41" opacity="0.9" filter="url(#shadow)" />

  <!-- Document Sheet -->
  <g transform="translate(146, 125)">
    <!-- White Paper Body -->
    <path d="M 15 0 L 150 0 L 220 70 L 220 250 A 15 15 0 0 1 205 265 L 15 265 A 15 15 0 0 1 0 250 L 0 15 A 15 15 0 0 1 15 0 Z" fill="#ffffff" filter="url(#shadow)" />
    <!-- Folded Corner -->
    <path d="M 150 0 L 150 55 A 15 15 0 0 0 165 70 L 220 70 Z" fill="#e2e8f0" />
    
    <!-- Document Lines / Content -->
    <!-- Avatar circle -->
    <circle cx="50" cy="55" r="22" fill="#006a4e" />
    <!-- Name line -->
    <rect x="85" y="42" width="60" height="12" rx="4" fill="#1e293b" />
    <rect x="85" y="60" width="40" height="8" rx="3" fill="#64748b" />

    <!-- Horizontal CV Section Dividers -->
    <rect x="25" y="105" width="170" height="6" rx="3" fill="#006a4e" />
    <rect x="25" y="125" width="140" height="8" rx="3" fill="#94a3b8" />
    <rect x="25" y="142" width="165" height="8" rx="3" fill="#cbd5e1" />
    <rect x="25" y="159" width="110" height="8" rx="3" fill="#cbd5e1" />

    <rect x="25" y="185" width="170" height="6" rx="3" fill="#006a4e" />
    <rect x="25" y="205" width="150" height="8" rx="3" fill="#94a3b8" />
    <rect x="25" y="222" width="130" height="8" rx="3" fill="#cbd5e1" />
  </g>

  <!-- Banner text badge -->
  <rect x="116" y="415" width="280" height="48" rx="24" fill="#ffffff" filter="url(#shadow)" />
  <text x="256" y="446" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="900" fill="#006a4e" text-anchor="middle" letter-spacing="1">BD PRO CV MAKER</text>
</svg>
